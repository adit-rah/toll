name: render

# Screenshots, accessibility trees and logs of the demo scenarios (docs/renders.md), so an agent with no
# Mac can see what it changed. Runs on demand, or on a push whose head commit says [render] (or
# [render light ax5] to choose variants). The output
# goes to the branch renders/<branch>, replaced each run; it is not a test and fails nothing.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "One per line: <scenario> or <scenario>: <axe step>; <axe step>. Blank renders all."
        required: false
        default: ""
      variants:
        description: "Any of: light dark ax5 dark-ax5"
        required: false
        default: "light"
  push:
    branches-ignore: ["main", "renders/**"]
    paths: ["ios/**", ".github/workflows/render.yml"]

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  render:
    if: >-
      github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[render]') ||
      contains(github.event.head_commit.message, '[render ')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      # A first boot takes minutes; it runs behind every step up to the screenshots.
      - name: Start booting a simulator
        run: echo "UDID=$(ios/scripts/render-device.sh)" >> "$GITHUB_ENV"
      # Homebrew takes minutes to tap and install; the installed copy is cached and only reinstalled
      # when it will not run.
      - name: Restore AXe
        id: axe
        uses: actions/cache/restore@v4
        with: { path: ~/axe, key: axe-v1 }
      - name: Install AXe
        run: |
          if [ -x ~/axe/bin/axe ] && ~/axe/bin/axe --version >/dev/null 2>&1; then
            echo "$HOME/axe/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          brew install cameroncooke/axe/axe
          rm -rf ~/axe && cp -RL "$(brew --prefix axe)" ~/axe
          ~/axe/bin/axe --version && echo "AXE_FRESH=1" >> "$GITHUB_ENV"
      - name: Save AXe
        if: env.AXE_FRESH == '1'
        uses: actions/cache/save@v4
        with: { path: ~/axe, key: axe-v1 }
      # A push can name its variants too: "[render light ax5]" in the commit message.
      - name: Variants from the commit message
        if: github.event_name == 'push'
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          variants=$(printf '%s' "$MESSAGE" | sed -n 's/.*\[render \([a-z5 -]*\)\].*/\1/p' | head -1)
          [ -n "$variants" ] && echo "PUSH_VARIANTS=$variants" >> "$GITHUB_ENV" || true
      - name: Render
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          VARIANTS: ${{ inputs.variants || env.PUSH_VARIANTS || 'light' }}
        run: ios/scripts/render.sh build/renders
      - name: Publish to renders/${{ github.ref_name }}
        if: always()
        env:
          PUSH_TOKEN: ${{ github.token }}
          BRANCH: renders/${{ github.ref_name }}
        run: |
          [ -f build/renders/README.md ] || exit 0
          cd build/renders
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Renders of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/$BRANCH"
          echo "Renders: https://github.com/$GITHUB_REPOSITORY/tree/$BRANCH" >> "$GITHUB_STEP_SUMMARY"
