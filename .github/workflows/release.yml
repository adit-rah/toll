name: release

# Every green build of main that changes the app becomes a TestFlight build, numbered by
# ios/scripts/next-version.sh so no one picks a version by hand (docs/releasing.md). The tag this
# creates is what Xcode Cloud builds; ci_post_clone.sh turns it into the app's version.
on:
  workflow_run:
    workflows: ["ios"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Only main, only after the compile check and tests passed on that exact commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Next version
        id: version
        run: |
          commit=$(git rev-parse HEAD)
          # A commit already released is not released again (a re-run, or a manual click).
          if existing=$(git tag --points-at "$commit" -l 'v*' | head -1) && [ -n "$existing" ]; then
            echo "Already released as $existing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A newer commit on main will release itself; an older green run must not jump ahead of it.
          if [ "$commit" != "$(git rev-parse origin/main)" ]; then
            echo "Not main's newest commit; leaving it to the newer run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(ios/scripts/next-version.sh)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version at $commit"
      - name: Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ steps.version.outputs.commit }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --prerelease --generate-notes
